<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tour 360 VR</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
    #hint{
      position:fixed;z-index:10;left:0;right:0;top:14px;text-align:center;color:#fff;
      opacity:.8;font-size:14px;pointer-events:none;transition:opacity .6s;
      text-shadow:0 1px 4px rgba(0,0,0,.8)
    }
  </style>
</head>
<body>
  <div id="hint">Arrastra para mirar · botón VR abajo a la derecha para gafas Meta Quest</div>

  <a-scene
    renderer="antialias: true; colorManagement: true; exposure: 1"
    vr-mode-ui="enabled: true"
    background="color: #000"
    loading-screen="dotsColor: white; backgroundColor: black">

    <a-assets>
      <img id="pano" src="tallerres.png" crossorigin="anonymous">
    </a-assets>

    <!-- Entorno 360 envolvente -->
    <a-sky src="#pano" rotation="0 -90 0"></a-sky>

    <!-- Cámara: mouse en desktop, giroscopio en móvil, headtracking en VR -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera
        wasd-controls-enabled="false"
        look-controls="reverseMouseDrag: true; magicWindowTrackingEnabled: true; touchEnabled: true; pointerLockEnabled: false">
      </a-camera>
    </a-entity>
  </a-scene>

  <script>
    var hint = document.getElementById('hint');
    setTimeout(function(){ hint.style.opacity = '0'; }, 6000);

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      var once = function () {
        DeviceOrientationEvent.requestPermission().catch(function(){});
        window.removeEventListener('touchend', once);
      };
      window.addEventListener('touchend', once);
    }

    document.getElementById('pano').addEventListener('error', function () {
      hint.style.opacity = '1';
      hint.textContent = 'No se pudo cargar tallerres.png';
    });
  </script>
</body>
</html>
