<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tour 360</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
    #pano{width:100%;height:100%}
    /* look & feel tipo krpano */
    .pnlm-load-box{background:#000!important;border-radius:0!important}
    .pnlm-controls{border-color:rgba(255,255,255,.4)!important}
    .pnlm-control{background:rgba(0,0,0,.55)!important}
    .pnlm-compass{filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
  </style>
</head>
<body>
  <div id="pano"></div>

  <script>
    var viewer = pannellum.viewer('pano', {
      type: 'equirectangular',
      panorama: 'exr_4k_fixed.jpg',
      autoLoad: true,
      crossOrigin: 'anonymous',

      // movimiento suave con inercia (como krpano)
      dynamic: false,
      friction: 0.15,
      mouseZoom: true,
      draggable: true,
      keyboardZoom: true,

      // rotación automática lenta que se detiene al tocar y vuelve sola
      autoRotate: -2,
      autoRotateInactivityDelay: 3000,

      // campo de visión / límites de zoom
      hfov: 110,
      minHfov: 50,
      maxHfov: 120,
      pitch: 0,
      yaw: 0,

      // extras
      compass: true,
      showZoomCtrl: true,
      showFullscreenCtrl: true,
      orientationOnByDefault: false,   // el usuario activa el giroscopio con el botón
      hotSpotDebug: false
    });

    // Doble clic / doble toque = acercar hacia donde apuntas
    document.getElementById('pano').addEventListener('dblclick', function () {
      viewer.setHfov(Math.max(viewer.getHfov() - 25, 50), 800);
    });

    // Aviso claro si la imagen no carga
    viewer.on('error', function (e) {
      document.getElementById('pano').innerHTML =
        '<div style="color:#fff;padding:24px;font-size:15px">No se pudo cargar el panorama: ' + e + '</div>';
    });
  </script>
</body>
</html>
